<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مزاج | MAZAJ</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f1e8;color:#35271e;font-family:Tahoma,Arial}header{text-align:center;background:#30241c;color:#f5e7cf;padding:45px 15px}header h1{font-size:48px;margin:8px}header p{color:#d6b994}main{max-width:850px;margin:auto;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:25px}button{font:inherit;cursor:pointer;border:1px solid #bfa98d;border-radius:24px;padding:10px 18px;background:transparent;color:inherit}button.active{background:#35271e;color:white}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}article{background:white;border-radius:18px;padding:20px;box-shadow:0 3px 15px #30241c0b}article .emoji{font-size:48px;background:#eee5d6;border-radius:12px;text-align:center;padding:20px}h3{margin-bottom:8px}small{color:#786b60}.price{font-weight:bold;margin-top:18px;color:#80532e}footer{text-align:center;padding:30px;color:#786b60}</style><header><div>COFFEE & DESSERTS</div><h1>مزاج</h1><div> M A Z A J </div><p>قهوتك على مزاجك</p></header><main><nav id="nav"></nav><div class="items" id="items"></div></main><footer>MAZAJ © 2026 · منيو تجريبي</footer><script>const data=[['ساخنة','☕','إسبريسو','قهوة مركزة وغنية',0.9],['ساخنة','☕','كابتشينو','إسبريسو مع رغوة الحليب',1.5],['ساخنة','☕','لاتيه','قهوة مع حليب مبخر',1.5],['باردة','🧊','آيس سبانش لاتيه','قهوة باردة وحليب محلى',2],['باردة','🥤','آيس أمريكانو','إسبريسو وماء وثلج',1.25],['باردة','🍵','آيس ماتشا','ماتشا مع الحليب',2.25],['حلويات','🍰','تشيز كيك','تشيز كيك كريمي',2.5],['حلويات','🍪','كوكيز','كوكيز بالشوكولاتة',1],['حلويات','🥐','كرواسون','كرواسون بالزبدة',1.25]];function show(c){document.getElementById('nav').innerHTML=['الكل','ساخنة','باردة','حلويات'].map(x=>`<button class="${x===c?'active':''}" onclick="show('${x}')">${x}</button>`).join('');document.getElementById('items').innerHTML=data.filter(x=>c==='الكل'||x[0]===c).map(x=>`<article><div class="emoji">${x[1]}</div><h3>${x[2]}</h3><small>${x[3]}</small><div class="price">${x[4].toFixed(3)} د.ك</div></article>`).join('')}show('الكل')</script></html>
